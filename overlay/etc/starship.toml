command_timeout = 3000
scan_timeout = 1000

format = """
[](fg:bright-black bg:black)\
$battery$username$hostname$shell\
[](fg:bright-black bg:black)\
$directory\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nim\
$rust\
[](bg:black fg:bright-black)\
$character\
[ ](fg:bright-black)\
"""

# Disable the blank line at the start of the prompt
add_newline = false

[custom.git_branch]
style = "bg:bright-black fg:bright-white bold"
command = "git rev-parse --abbrev-ref HEAD"
when = "git rev-parse --is-inside-work-tree"
format = '[$output]($style)'

[os]
style = "bg:bright-black fg:bright-white bold"
format = "[$symbol]($style)"
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = "N "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[shell]
style = "bg:bright-black fg:bright-white bold"
format = "[$indicator]($style)"
disabled = false
fish_indicator = ' 󰈺'
powershell_indicator = ' '
bash_indicator = ''
zsh_indicator = ''

[battery]
format=  '[$symbol$percentage ]($style)'

[[battery.display]]
threshold = 75
style = 'bg:bright-black fg:black'

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:bright-black fg:bright-white bold"
style_root = "bg:bright-black fg:red bold"
format = '[$user]($style)'

[hostname]
style = "bg:bright-black fg:bright-white bold"
format = '[@$hostname ]($style)'
ssh_only = true
disabled = false

[directory]
style = "bg:black bold"
format = "[ $path ]($style)"
truncation_length = 0
truncation_symbol = ""


[c]
symbol = " "
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:blue fg:bright-white bold"
format = '[ $symbol $context ]($style) $path'

[kubernetes]
symbol = "☸ "
style = "bg:blue fg:bright-white bold"
format = '[ $symbol $context ]($style)'
disabled = true

[elixir]
symbol = " "
style = "bg:black"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:black"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:bright-black fg:bright-white bold"
format = '[](fg:black bg:black)[$symbol $branch]($style)'

[git_status]
style = "bg:bright-black fg:bright-white bold"
format = '[ $all_status$ahead_behind]($style)[](fg:black bg:black)'

[golang]
symbol = " "
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:black"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:black fg:bright-white bold"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:bright-white fg:bright-black bold"
# format = '[ ♥ $time ]($style)'
format = '[$time ]($style)'

[character]
disabled = false
success_symbol = "[✓](bg:bright-black fg:green)"
error_symbol = "[×](bg:bright-black fg:yellow)"
# format = '[ ♥ $time ]($style)'
format = "$symbol"
