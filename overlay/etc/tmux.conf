# DevTerm A04 default tmux configuration.
# Screen-style prefix and mouse support.

set-option -g mouse on

# Use Ctrl-a instead of Ctrl-b.
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits: | for a vertical split, - for a horizontal split.
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Bright white status bar with black text.
set-option -g status-bg colour15
set-option -g status-fg colour0
set-option -g status-left "#[fg=colour0,bg=colour15,bold] #S "
set-option -g status-left-length 40
set-option -g status-interval 5
set-option -g status-right-length 110

# Right side: live Wi-Fi, Tailscale and battery status, then the time.  The
# battery icon is a Nerd Font glyph; the console font ships it.
set-option -g status-right "#[bold] #(/usr/local/bin/devterm-wifi status) | #(/usr/local/bin/devterm-tailscale-status) #[nobold] #(/usr/local/bin/devterm-battery) | %H:%M "

# Clicking the status bar opens the NetworkManager TUI in a popup, except on
# the window list: that click must select the window.  tmux dispatches a click
# on a window entry as MouseDown1Status, empty bar space as StatusDefault and
# the left/right text as StatusLeft/StatusRight.  MouseDown1Status is bound
# explicitly so a "source-file" on a running server restores tab selection.
bind-key -n MouseDown1Status select-window -t =
bind-key -n MouseDown1StatusLeft popup -E -w 80 -h 20 "sudo /usr/local/bin/devterm-wifi"
bind-key -n MouseDown1StatusDefault popup -E -w 80 -h 20 "sudo /usr/local/bin/devterm-wifi"
bind-key -n MouseDown1StatusRight popup -E -w 80 -h 20 "sudo /usr/local/bin/devterm-wifi"
